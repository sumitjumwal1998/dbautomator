- name: DROP SQL logins
  hosts: mssql
  gather_facts: no

  vars:
    sa_username: "{{ username }}"
    sa_password: "{{ password }}"
    sql_login: "{{ login_to_drop }}"

    
  tasks:
      
     - name: Drop SQL Login
       win_shell: |
               sqlcmd -E -S localhost\HCL -Q "DROP LOGIN {{ login_to_drop }}"



